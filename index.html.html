  padding:calc(32px + env(safe-area-inset-top,0px)) 24px 34px;
  border-radius:0 0 28px 28px;border-bottom:5px solid var(--brown);
}
.hero::before{
  content:"";position:absolute;inset:10px 10px 14px;border:2px dashed var(--brown);
  border-radius:20px;pointer-events:none;opacity:.85;
}
.emblem{
  width:84px;height:84px;margin:0 auto 12px;border-radius:50%;overflow:hidden;
  background:var(--cream);border:3px solid var(--brown);box-shadow:0 0 0 4px var(--navy),0 0 0 7px var(--brown);
}
.emblem img{width:100%;height:100%;object-fit:cover}
.hero h1{position:relative;margin:0;font-size:2.2rem;font-weight:800;line-height:1.25}
.hero .tagline{position:relative;margin:6px 0 0;color:var(--sage);font-size:1rem;font-weight:600}
.chips{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{background:var(--brown);color:var(--cream);font-size:.8rem;font-weight:700;padding:6px 14px;border-radius:999px}

/* ===== التصنيفات (شريط ثابت) ===== */
.tabs-bar{
  position:sticky;top:0;z-index:10;background:var(--cream);
  border-bottom:2px solid var(--navy);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;
}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 14px;scrollbar-width:none;max-width:900px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;overflow:hidden;flex-shrink:0;cursor:pointer;font-family:inherit;
  font-size:1rem;font-weight:700;color:var(--navy);background:var(--sage);
  border:2px solid var(--navy);border-radius:999px;min-height:44px;padding:0 22px;z-index:0;
  box-shadow:2px 2px 0 var(--navy);transition:color .3s,transform .15s,box-shadow .15s;
}
.tab::before{content:"";position:absolute;inset:0;background:var(--navy);z-index:-1;transform:translateX(101%);transition:transform .3s ease}
.tab.active{color:var(--cream)}
.tab.active::before{transform:translateX(0)}
.tab:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--navy)}

/* ===== المحتوى ===== */
.wrap{max-width:900px;margin:0 auto;padding:4px 14px 40px}
.section{margin-top:26px;scroll-margin-top:calc(78px + env(safe-area-inset-top,0px));animation:rise .45s ease both}
.section h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:1.4rem;font-weight:800}
.section h2::before{content:"";width:12px;height:12px;background:var(--brown);border:2px solid var(--navy);transform:rotate(45deg)}
.section h2::after{content:"";flex:1;height:3px;background:var(--brown);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}

/* ===== بطاقة المنتج ===== */
.card{
  display:flex;flex-direction:column;background:var(--cream);border:2px solid var(--navy);
  border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 var(--brown);
  transition:transform .2s,box-shadow .2s;
}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--brown)}
.thumb{position:relative;aspect-ratio:1/1;background:var(--sage);border-bottom:2px solid var(--navy);overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 12px 12px}
.info h3{margin:0;font-size:1rem;font-weight:800;line-height:1.35}
.info p{margin:4px 0 0;direction:ltr;text-align:right;font-size:.8rem;line-height:1.6;color:var(--navy);opacity:.82}
.price{margin-top:auto;padding-top:8px}
.price b{
  display:inline-block;background:var(--navy);color:var(--cream);font-weight:800;font-size:.88rem;
  padding:3px 12px;border-radius:999px;
}

footer{text-align:center;padding:0 14px calc(30px + env(safe-area-inset-bottom,0px))}
footer span{display:inline-block;background:var(--brown);color:var(--cream);padding:9px 24px;border-radius:999px;font-size:.9rem;font-weight:600}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== اللودر (Uiverse.io by Zadrus — بألوان الموقع) ===== */
#loader{
  position:fixed;inset:0;z-index:100;background:var(--navy);
  display:flex;justify-content:center;align-items:center;
  transition:opacity .5s ease,visibility .5s;
}
#loader.hide{opacity:0;visibility:hidden}
.loader-box{width:200px;height:200px;display:flex;justify-content:center;align-items:center;border-radius:50%}
.loader{
  width:20px;height:40px;border-radius:10px 50px;
  box-shadow:0 0 5px var(--brown);animation:dominos 1s ease infinite;
}
.loader:nth-child(1){animation-delay:.325s;background-color:var(--brown)}
.loader:nth-child(2){animation-delay:.5s;background-color:var(--sage)}
.loader:nth-child(3){animation-delay:.625s;background-color:var(--cream)}
.loader:nth-child(4){animation-delay:.74s;background-color:var(--sage)}
.loader:nth-child(5){animation-delay:.865s;background-color:var(--brown)}
@keyframes dominos{
  50%{opacity:.7}
  75%{-webkit-transform:rotate(90deg);transform:rotate(90deg)}
  80%{opacity:1}
}
</style>
</head>
<body>
<div id="loader"><div class="loader-box">
  <div class="loader"></div><div class="loader"></div><div class="loader"></div><div class="loader"></div><div class="loader"></div>
</div></div>

<header class="hero">
  <div class="emblem" id="emblem"></div>
  <h1 id="shopName"></h1>

<div class="tabs-bar"><nav class="tabs" id="tabs"></nav></div>
<main class="wrap" id="menu"></main>
<footer><span id="footerText"></span></footer>

<script>
/* ==========================================================
   1) بيانات المتجر — عدّل من هنا
   logo: رابط شعارك (اتركه "" وسيختفي مكان الشعار)
   ========================================================== */
const SHOP = {

/* ==========================================================

   ========================================================== */

  { id: "drip",   name: "القهوة المقطرة" },
  { id: "sweets", name: "الحلويات" }
];

/* ==========================================================
   3) المنتجات — category = id التصنيف
   desc: الاسم بالإنجليزي (يمكن تغييره لوصف المنتج)
   image: رابط الصورة (اتركه "" لعرض لون فقط)
   ========================================================== */
const PRODUCTS = [
  // --- المشروبات الساخنة ---
  { category: "hot", name: "لاتيه",                  desc: "Latte",                price: 13, image: "" },
  { category: "hot", name: "كورتادو",                desc: "Cortado",              price: 11, image: "" },
  { category: "hot", name: "فلات وايت",              desc: "Flat White",           price: 12, image: "" },
  { category: "hot", name: "سبانش لاتيه",            desc: "Spanish Latte",        price: 12, image: "" },
  { category: "hot", name: "كابتشينو",               desc: "Cappuccino",           price: 12, image: "" },
  { category: "hot", name: "اسبريسو",                desc: "Espresso",             price: 9,  image: "" },
  { category: "hot", name: "امريكانو حار",           desc: "Americano",            price: 10, image: "" },
  { category: "hot", name: "قهوة ايطالي",            desc: "Italian coffee",       price: 12, image: "" },
  { category: "hot", name: "قهوة تركي",              desc: "Turkish coffee",       price: 9,  image: "" },
  { category: "hot", name: "قهوة فرنسي",             desc: "French coffee",        price: 12, image: "" },
  { category: "hot", name: "قهوة سعودية",            desc: "Saudi Coffee",         price: 5,  image: "" },
  { category: "hot", name: "دلة قهوة سعودية",        desc: "Saudi Coffee Dallah",  price: 10, image: "" },
  { category: "hot", name: "دلة قهوة سعودية مع التمر", desc: "Saudi coffee with dates", price: 15, image: "" },
  { category: "hot", name: "شاي",                    desc: "Tea",                  price: 2,  image: "" },

  // --- المشروبات الباردة ---
  { category: "cold", name: "امريكانو بارد",         desc: "Cold Americano",          price: 10, image: "" },
  { category: "cold", name: "ايس كراميل ميكاتو",     desc: "Ice caramel macchiato",   price: 15, image: "" },
  { category: "cold", name: "بستاشيو لاتيه",         desc: "Pistachio Latte",         price: 16, image: "" },
  { category: "cold", name: "سبانش لاتيه",           desc: "Spanish Latte",           price: 15, image: "" },
  { category: "cold", name: "ايس كراميل لاتيه",      desc: "Ice caramel latte",       price: 14, image: "" },
  { category: "cold", name: "ايس وايت موكا",         desc: "Ice white mocha",         price: 15, image: "" },
  { category: "cold", name: "موهيتو ",            desc: "Cloud mojito",            price: 10, image: "" },
  { category: "cold", name: "موهيتو بلوبيري",        desc: "Blueberry mojito",        price: 10, image: "" },
  { category: "cold", name: "موهيتو فراولة",         desc: "Strawberry mojito",       price: 10, image: "" },
  { category: "cold", name: "موهيتو أناناس",         desc: "Pineapple mojito",        price: 10, image: "" },
  { category: "cold", name: "آيس تي خوخ",            desc: "Ice tea peach",           price: 10, image: "" },

  // --- القهوة المقطرة ---
  { category: "drip", name: "في 60 حار",             desc: "Hot V60",                 price: 10, image: "" },
  { category: "drip", name: "في 60 حار فاخر",        desc: "Special Hot V60",         price: 15, image: "" },
  { category: "drip", name: "في 60 بارد",            desc: "Cold V60",                price: 10, image: "" },
  { category: "drip", name: "في 60 بارد فاخر",       desc: "Special Cold V60",        price: 15, image: "" },

  // --- الحلويات ---
  { category: "sweets", name: "كوكيز صاج",           desc: "Saj cookies",             price: 13,  image: "" },
  { category: "sweets", name: "كوكيز كلاسيك",        desc: "Classic cookies",         price: 6,   image: "" },
  { category: "sweets", name: "كوكيز سينابون",       desc: "Cinnabon cookies",        price: 10,  image: "" },
  { category: "sweets", name: "براونيز",             desc: "Brownies",                price: 6,   image: "" },
  { category: "sweets", name: "كيكة مانجو",          desc: "Mango cake",              price: 20,  image: "" },
  { category: "sweets", name: "كيكة رد فلفت",        desc: "Red velvet cake",         price: 20,  image: "" },
  { category: "sweets", name: "كيكة تيراميسو",       desc: "Tiramisu cake",           price: 20,  image: "" },
  { category: "sweets", name: "كيكة كوكيز صغير",     desc: "Small cookie cake",       price: 25,  image: "" },

  { category: "sweets", name: "كيكة كوكيز كبير",     desc: "Big cookie cake",         price: 85,  image: "" },
  { category: "sweets", name: "كيكة كوكيز مناسبات",  desc: "Cookie cake for occasions", price: 100, image: "" },
  { category: "sweets", name: "كيكة ",            desc: "Cloud cake",              price: 20,  image: "" },
  { category: "sweets", name: "كيكة الجزر",          desc: "Carrot Cake",             price: 18,  image: "" },
  { category: "sweets", name: "كيكة العسل",          desc: "Honey cake",              price: 16,  image: "" },
  { category: "sweets", name: "سان سيباستيان",       desc: "San Sebastian",           price: 15,  image: "" },
  { category: "sweets", name: "بان كيك",             desc: "Pancake",                 price: 10,  image: "" },
  { category: "sweets", name: "بان كيك مكس",         desc: "Pancake mix",             price: 14,  image: "" },
  { category: "sweets", name: "بوكس بان كيك وسط",    desc: "Medium pancake box",      price: 35,  image: "" },
  { category: "sweets", name: "بوكس بان كيك كبير",   desc: "Large pancake box",       price: 55,  image: "" },
  { category: "sweets", name: "فرنش توست",           desc: "French toast",            price: 13,  image: "" }
];

/* ==========================================================
   كود العرض — لا تحتاج تعديله
   ========================================================== */
document.getElementById("shopName").textContent = SHOP.name;
document.getElementById("shopTagline").textContent = SHOP.tagline;
document.getElementById("footerText").textContent = SHOP.footer;
const emblem = document.getElementById("emblem");
if (SHOP.logo) emblem.innerHTML = '<img src="' + SHOP.logo + '" alt="">'; else emblem.remove();
document.getElementById("chips").innerHTML = SHOP.features.map(f => "<span>" + f + "</span>").join("");

const tabs = document.getElementById("tabs");
const menu = document.getElementById("menu");
const bar = document.querySelector(".tabs-bar");

// بناء الأقسام والتبويبات مرة واحدة
CATEGORIES.forEach(c => {
  const items = PRODUCTS.filter(p => p.category === c.id);
  if (!items.length) return;

  const sec = document.createElement("section");
  sec.className = "section";
  sec.id = "cat-" + c.id;
  sec.innerHTML = "<h2>" + c.name + "</h2>";
  const grid = document.createElement("div");
  grid.className = "grid";
  items.forEach(p => {
    const pic = p.image ? '<img src="' + p.image + '" alt="' + p.name + '" loading="lazy">' : "";
    grid.insertAdjacentHTML("beforeend",
      '<article class="card"><div class="thumb' + (p.image ? "" : " empty") + '">' + pic + "</div>" +
      '<div class="info"><h3>' + p.name + "</h3><p>" + (p.desc || "") + "</p>" +
      '<div class="price"><b>' + p.price + " " + SHOP.currency + "</b></div></div></article>");
  });
  sec.appendChild(grid);
  menu.appendChild(sec);

  const b = document.createElement("button");
  b.className = "tab";
  b.textContent = c.name;
  b.dataset.id = c.id;
  b.onclick = () => {
    setActive(c.id);
    sec.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  tabs.appendChild(b);
});

// تمييز التبويب الحالي وتمرير الشريط ليظهر التبويب
function setActive(id) {
  tabs.querySelectorAll(".tab").forEach(t => {
    const on = t.dataset.id === id;
    t.classList.toggle("active", on);
    if (on) {
      const r = t.getBoundingClientRect(), w = tabs.getBoundingClientRect();
      tabs.scrollBy({ left: (r.left + r.width / 2) - (w.left + w.width / 2), behavior: "smooth" });
    }
  });
}

// تحديث التبويب النشط أثناء التمرير
let ticking = false, current = null;
function onScroll() {
  ticking = false;
  const line = bar.offsetHeight + 40;
  let id = CATEGORIES[0].id;
  menu.querySelectorAll(".section").forEach(sec => {
    if (sec.getBoundingClientRect().top <= line) id = sec.id.replace("cat-", "");
  });
  if (id !== current) { current = id; setActive(id); }
}
window.addEventListener("scroll", () => {
  if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
}, { passive: true });
onScroll();

// إخفاء اللودر بعد تحميل الصفحة (حد أدنى 1.5 ثانية)
const loaderEl = document.getElementById("loader");
const t0 = Date.now();
function hideLoader() {
  loaderEl.classList.add("hide");
  setTimeout(() => loaderEl.remove(), 600);
}
window.addEventListener("load", () => setTimeout(hideLoader, Math.max(0, 1500 - (Date.now() - t0))));
setTimeout(hideLoader, 4000);
</script>
</body>
</html>
